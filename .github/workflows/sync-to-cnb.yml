# .github/workflows/sync-to-cnb.yml
name: Sync to CNB

on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-to-cnb
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync to CNB repository
        uses: docker://tencentcom/git-sync
        env:
          PLUGIN_TARGET_URL: https://cnb.cool/TomyJan/WutheringWaves-UIResources
          PLUGIN_AUTH_TYPE: https
          PLUGIN_USERNAME: cnb
          PLUGIN_PASSWORD: ${{ secrets.CNB_TOKEN }}
          PLUGIN_FORCE: "true"
          PLUGIN_PUSH_TAGS: "true"
